<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實況野球風格 MLB & CPBL 遊戲 - 終極完全版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at center, #0d1f35 0%, #040c16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            cursor: crosshair;
            box-shadow: 0 0 0 2px rgba(0, 200, 100, 0.15), 0 0 50px rgba(0, 140, 60, 0.2), 0 0 100px rgba(0, 0, 0, 0.95);
        }

        #c3d {
            position: fixed;
            left: 0;
            top: 0;
            display: none;
            pointer-events: none;
            box-shadow: none;
            cursor: default;
        }

        #c {
            position: relative;
            z-index: 1;
        }

        /* touch buttons sit in the left/right thumb zones so the zone + timing bar stay clear */
        #mobile-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        .mbtn {
            position: absolute;
            pointer-events: auto;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            line-height: 1.3;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .mbtn:active {
            transform: scale(0.86);
        }

        #sim-btn {
            width: 72px;
            height: 72px;
            font-size: 12px;
            background: radial-gradient(circle at 40% 35%, #4466aa, #1a2a44);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 14px rgba(68, 100, 200, 0.4);
            border: 2px solid rgba(100, 150, 255, 0.7);
        }

        #swing-btn {
            width: 96px;
            height: 96px;
            font-size: 16px;
            background: radial-gradient(circle at 40% 35%, #ff9922, #cc4400);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7), 0 0 22px rgba(255, 120, 0, 0.55);
            border: 3px solid rgba(255, 210, 80, 0.9);
        }

        #change-btn {
            width: 72px;
            height: 72px;
            font-size: 12px;
            background: radial-gradient(circle at 40% 35%, #338844, #115522);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 14px rgba(50, 200, 80, 0.4);
            border: 2px solid rgba(80, 220, 100, 0.7);
        }

        #steal-btn {
            width: 72px;
            height: 72px;
            font-size: 12px;
            background: radial-gradient(circle at 40% 35%, #aa6600, #552200);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 14px rgba(200, 120, 0, 0.4);
            border: 2px solid rgba(255, 180, 60, 0.7);
        }

        .mbtn.show {
            display: flex;
        }

        #swing-btn {
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
        }

        #change-btn {
            left: max(18px, env(safe-area-inset-left));
            bottom: max(18px, env(safe-area-inset-bottom));
        }

        #sim-btn {
            left: max(18px, env(safe-area-inset-left));
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px);
        }

        #steal-btn {
            left: max(18px, env(safe-area-inset-left));
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px);
        }

        #bunt-btn {
            left: max(18px, env(safe-area-inset-left));
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 168px);
            width: 72px; height: 72px; font-size: 12px;
            background: radial-gradient(circle at 40% 35%, #556, #223);
            border: 2px solid rgba(180, 180, 255, 0.7);
        }

        #power-btn {
            left: max(18px, env(safe-area-inset-left));
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 252px);
            width: 72px; height: 72px; font-size: 12px;
            background: radial-gradient(circle at 40% 35%, #a43, #411);
            border: 2px solid rgba(255, 160, 120, 0.7);
        }

        #mp-overlay {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(4, 10, 20, 0.92);
            z-index: 200;
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #mp-overlay.show {
            display: flex;
        }

        #mp-overlay h2 {
            font-size: 22px;
            color: #ffd700;
        }

        #mp-overlay .mp-btn {
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid rgba(100, 150, 255, 0.7);
            background: radial-gradient(circle at 40% 35%, #4466aa, #1a2a44);
            color: #fff;
            cursor: pointer;
        }

        #mp-overlay .mp-btn:active {
            transform: scale(0.96);
        }

        #mp-qr {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        #mp-room-code {
            font-size: 20px;
            letter-spacing: 2px;
            color: #44ff88;
            font-weight: bold;
            word-break: break-all;
        }

        #mp-status {
            font-size: 14px;
            color: #ccc;
        }

        #mp-overlay { overflow-y: auto; }

        #mp-overlay .mp-sub { font-size: 14px; color: #9fb0cc; margin-top: 4px; }

        #mp-overlay .mp-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }

        #mp-overlay .mp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
            width: min(620px, 92vw);
            max-height: 36vh;
            overflow-y: auto;
            padding: 4px;
        }

        #mp-overlay .mp-team {
            padding: 9px 4px;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-left-width: 6px;
            border-radius: 8px;
            cursor: pointer;
        }

        #mp-overlay .mp-team.sel { background: rgba(255, 200, 40, 0.28); border-color: #ffd23a; }
        #mp-overlay .mp-team.taken { opacity: 0.3; cursor: not-allowed; }
        #mp-overlay .mp-btn.sel { outline: 3px solid #ffd23a; }
        #mp-overlay .mp-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .mp-hidden {
            display: none !important;
        }
    </style>
</head>

                    } else { G.curX = clamp((mouseX - SZcx) / (SZw / 2), -1.5, 1.5); G.curY = clamp((mouseY - SZcy) / (SZh / 2), -1.5, 1.5); }
                    // timing cursor is tied to the ball: the SWEET spot (phPos 0.5) is exactly when the ball crosses the plate.
                    // phW = how fast the bar sweeps per pitch-flight (easy 0.7 / normal 1.0 / hard 1.4)
                    const flightT = (G.frame - G.ballFrame) / G.ballDur, phW = G.phW || 1;

            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

        }

        function drawFace(ctx, name, isSide = false, headY = 0) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const eIdx = Math.abs(hash) % 4;
            const mIdx = Math.abs(hash >> 2) % 3;

            ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
            const ex = isSide ? 8 : 0;
            const ey = headY - 2;

            ctx.save(); ctx.translate(ex, ey);
            if (eIdx === 0) { // normal
                ctx.beginPath(); ctx.ellipse(-9, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill();
                if (!isSide) { ctx.beginPath(); ctx.ellipse(9, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill(); }
                else { ctx.beginPath(); ctx.ellipse(9, 0, 2, 5, 0, 0, Math.PI * 2); ctx.fill(); }
            } else if (eIdx === 1) { // angry
                ctx.beginPath(); ctx.ellipse(-9, 0, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-5, -3); ctx.stroke();
                if (!isSide) {
                    ctx.beginPath(); ctx.ellipse(9, 0, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(14, -6); ctx.lineTo(5, -3); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.ellipse(9, 0, 1.5, 4, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(13, -5); ctx.lineTo(6, -3); ctx.stroke();
                }
            } else if (eIdx === 2) { // closed
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-5, 0); ctx.stroke();
                if (!isSide) { ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(5, 0); ctx.stroke(); }
                else { ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(5, 0); ctx.stroke(); }
            } else { // dots
                ctx.beginPath(); ctx.arc(-9, 0, 2.5, 0, Math.PI * 2); ctx.fill();
                if (!isSide) { ctx.beginPath(); ctx.arc(9, 0, 2.5, 0, Math.PI * 2); ctx.fill(); }
                else { ctx.beginPath(); ctx.arc(9, 0, 1.5, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.restore();

            const mx = isSide ? 12 : 0;
            const my = headY + 4;
            ctx.save(); ctx.translate(mx, my);
            if (mIdx === 0) { // smile
                ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI); ctx.stroke();
            } else if (mIdx === 1) { // line
                ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-3, 1); ctx.lineTo(3, 1); ctx.stroke();
            } else { // open
                ctx.beginPath(); ctx.ellipse(0, 2, 3, 2.5, 0, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        // ── HR base-run animation ──
        function drawHRRunners() {
            if (G.phase !== PH.HR_RUN || !G.hrRunners.length) return;
            const HR_LEG = 45;
            const elapsed = G.frame - G.hrRunFrame;
            const team = batTeamInfo();
            const basePts = [
                { x: W/2,       y: 490 }, // home (start)
                { x: W/2 + 142, y: 372 }, // 1B
                { x: W/2,       y: 195 }, // 2B
                { x: W/2 - 142, y: 372 }, // 3B
                { x: W/2,       y: 490 }, // home (finish)
            ];

            G.hrRunners.forEach(runner => {
                const totalLegs = 4 - runner.startBase;
                const runElapsed = elapsed; // all start at same time
                if (runElapsed >= totalLegs * HR_LEG) return; // already scored

                const legIdx = Math.floor(runElapsed / HR_LEG);
                const legT   = (runElapsed % HR_LEG) / HR_LEG;
                const t      = legT * legT * (3 - 2 * legT); // smoothstep

                const fromBase = runner.startBase + legIdx;
                const toBase   = fromBase + 1;
                const from     = basePts[fromBase], to = basePts[toBase];
                const rx = lerp(from.x, to.x, t);
                const ry = lerp(from.y, to.y, t);

                const ps = 0.28 + (ry - 148) / (540 - 148) * 0.58;
                const bob = Math.sin(G.runnerAnimPhase * 2.8) * 2.5;

                ctx.save();
                ctx.translate(rx, ry + bob * ps);

                // HR glow trail
                const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 30 * ps);
                grd.addColorStop(0, 'rgba(255,200,0,0.6)');
                grd.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.arc(0, 0, 30 * ps, 0, Math.PI * 2); ctx.fill();

                ctx.scale(ps, ps);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.38)';
                ctx.beginPath(); ctx.ellipse(0, 22, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

                // Animated legs
                const stride = Math.sin(G.runnerAnimPhase * 2.8) * 9;
                ctx.strokeStyle = team.c2 === '#FFFFFF' ? '#CCCCCC' : team.c2;
                ctx.lineWidth = 4; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(-6 + stride, 22); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(3, 12); ctx.lineTo(6 - stride, 22); ctx.stroke();

                // Body
                ctx.fillStyle = team.jersey || '#FFFFFF';
                ctx.beginPath(); ctx.ellipse(0, 4, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = team.c1; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(0, 4, 9, 11, 0, 0, Math.PI * 2); ctx.stroke();

                // Arms
                const armSwing = Math.sin(G.runnerAnimPhase * 2.8) * 14;
                ctx.strokeStyle = team.jersey || '#FFFFFF'; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(-16, 4 + armSwing); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(16, 4 - armSwing); ctx.stroke();

                // Head
                ctx.fillStyle = '#FFD0A0';
                ctx.beginPath(); ctx.arc(0, -13, 9, 0, Math.PI * 2); ctx.fill();

                // Hat (team colour)
                ctx.fillStyle = team.c1;
                ctx.beginPath(); ctx.arc(0, -15, 10, Math.PI, 0); ctx.fill();
                ctx.fillRect(-10, -15, 20, 5);

                ctx.restore();
            });
        }

                ctx.beginPath(); ctx.arc(0, -15, 10, Math.PI, 0); ctx.fill();

                ctx.restore();
            });
        }

        // Strike-zone view of the selected pitch: where it enters the zone (hollow circle = 投球點) and where it
        // ends up after the break (filled circle = 進壘位置), joined by a curved arrow.
        function renderPitchPreview() {
            if (!uiPitching()) return;
            let idx = -1, ex = SZcx, ey = SZcy;
            if (G.phase === PH.PITCH_SELECT && G.hoveredPitchChoice >= 0) idx = G.hoveredPitchChoice;
            else if ((G.phase === PH.AIM && G.aimState === 1) || G.phase === PH.POWER_GAUGE) { idx = G.pitchChoice; ex = SZcx + G.aimX * (SZw / 2); ey = SZcy + G.aimY * (SZh / 2); }
            if (idx < 0) return;
            const po = getPitcher().pitches[idx]; if (!po) return;
            const pd = PITCH_DICT[po.id], { cx, cy } = breakPx(po);
            const col = pd.col, ox = ex, oy = ey, tx = ex + cx, ty = ey + cy, brk = Math.hypot(cx, cy);
            ctx.save();
            // like Pawapuro: the zone lights up while choosing so the movement reads clearly
            ctx.fillStyle = 'rgba(245,248,255,0.55)'; ctx.fillRect(SZcx - SZw / 2, SZcy - SZh / 2, SZw, SZh);
            ctx.strokeStyle = 'rgba(40,70,140,0.7)'; ctx.lineWidth = 1;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath(); ctx.moveTo(SZcx - SZw / 2 + SZw * i / 3, SZcy - SZh / 2); ctx.lineTo(SZcx - SZw / 2 + SZw * i / 3, SZcy + SZh / 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(SZcx - SZw / 2, SZcy - SZh / 2 + SZh * i / 3); ctx.lineTo(SZcx + SZw / 2, SZcy - SZh / 2 + SZh * i / 3); ctx.stroke();
            }
            // dotted trail from the aim point to the estimated landing, ending in an arrow head
            const nDots = Math.max(0, Math.floor(brk / 6));
            for (let i = 1; i <= nDots; i++) {
                const u = i / (nDots + 1);
                ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(lerp(ox, tx, u), lerp(oy, ty, u), 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            if (brk > 3) {
                const ang = Math.atan2(ty - oy, tx - ox), hx = tx, hy = ty;
                ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(hx + 9 * Math.cos(ang), hy + 9 * Math.sin(ang)); ctx.lineTo(hx + 9 * Math.cos(ang + 2.5), hy + 9 * Math.sin(ang + 2.5)); ctx.lineTo(hx + 9 * Math.cos(ang - 2.5), hy + 9 * Math.sin(ang - 2.5)); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            // 準星 (aim point)
            ctx.strokeStyle = '#18b6e6'; ctx.fillStyle = 'rgba(24,182,230,0.35)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            [[-13, 0, -8, 0], [8, 0, 13, 0], [0, -13, 0, -8], [0, 8, 0, 13]].forEach(([a1, b1, c1, d1]) => { ctx.beginPath(); ctx.moveTo(ox + a1, oy + b1); ctx.lineTo(ox + c1, oy + d1); ctx.stroke(); });
            const inZone = isStrikePos((tx - SZcx) / (SZw / 2), (ty - SZcy) / (SZh / 2));
            // 球種 label under the zone (movement in cm as a second line)
            if (G.phase === PH.POWER_GAUGE) { ctx.restore(); return; }          // the power bar is showing the pitch name
            const hcm = Math.round(Math.abs(cx) / 180 * 100), vcm = Math.round(Math.abs(cy) / 180 * 100);
            const mv = []; if (hcm >= 2) mv.push((cx < 0 ? '向左 ' : '向右 ') + hcm + 'cm'); if (vcm >= 2) mv.push((cy > 0 ? '下沉 ' : '上飄 ') + vcm + 'cm'); if (!mv.length) mv.push('直線進壘');
            const sub = mv.join('  ') + (G.phase === PH.PITCH_SELECT ? '' : (inZone ? '  ·  好球（碰到好球帶）' : '  ·  壞球位置'));
            ctx.font = `bold 15px ${HUD_FONT}`; const tw = Math.max(ctx.measureText(pd.name + '  000 km/h').width + 30, ctx.measureText(sub).width + 30, 150), lx = SZcx - tw / 2, ly = SZcy + SZh / 2 + 12;
            const g2 = ctx.createLinearGradient(0, ly, 0, ly + 46); g2.addColorStop(0, '#16266b'); g2.addColorStop(1, '#0a1240');
            ctx.fillStyle = g2; drawRoundRect(ctx, lx, ly, tw, 46, 14); ctx.fill(); ctx.strokeStyle = 'rgba(160,190,255,0.7)'; ctx.lineWidth = 1.5; drawRoundRect(ctx, lx, ly, tw, 46, 14); ctx.stroke();
            const title = pd.name + '  ' + pitchKmh(getPitcher(), po) + ' km/h';
            ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(title, SZcx, ly + 20);
            ctx.font = `12px ${HUD_FONT}`; ctx.fillStyle = col; ctx.fillText(sub, SZcx, ly + 38);
            ctx.restore();
        }

        function renderHitEffect() {
            const eTime = G.frame - G.hitEffectFrame;
            if (eTime < 0 || eTime >= 40 || G.hitType === 'OUT') return;
            const cx = SZcx + G.curX * (SZw / 2), cy = SZcy + G.curY * (SZh / 2);
            const isHR = G.hitType === 'HR';
            const alpha = Math.max(0, 1 - eTime / 38);
            ctx.save(); ctx.translate(cx, cy); ctx.globalAlpha = alpha;

            // Flash on contact
            if (eTime < 5) {
                ctx.fillStyle = `rgba(255,255,255,${(0.55 - eTime * 0.1)})`;
                ctx.fillRect(-W, -H, W * 2, H * 2);
            }

            // Expanding shockwave rings
            const ringCols = isHR ? ['#FF4444', '#FFD700', '#FF8800'] : ['#00FFFF', '#44AAFF'];
            ringCols.forEach((col, ri) => {
                const delay = ri * 5;
                if (eTime < delay) return;
                const r = (eTime - delay) * (isHR ? 14 : 11);
                ctx.strokeStyle = col; ctx.lineWidth = isHR ? 4 : 2.5;
                ctx.globalAlpha = alpha * (1 - ri * 0.3);
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
            });
            ctx.globalAlpha = alpha;

            // Spark particles (radial burst)
            const sparkCol = isHR ? '#FFD700' : '#FFFFFF';
            const sparkCount = isHR ? 14 : 9;
            for (let i = 0; i < sparkCount; i++) {
                const angle = (Math.PI * 2 / sparkCount) * i + eTime * 0.08;
                const dist = eTime * (isHR ? 10 : 7.5);
                const sz = Math.max(0, 8 + (isHR ? 4 : 0) - eTime * 0.4);
                ctx.fillStyle = sparkCol;
                ctx.beginPath(); ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, sz, 0, Math.PI * 2); ctx.fill();
            }

            // Spark streaks (short lines shooting outward)
            if (eTime < 15) {
                const streakCol = isHR ? '#FFA500' : '#88DDFF';
                ctx.strokeStyle = streakCol; ctx.lineWidth = isHR ? 3 : 2; ctx.lineCap = 'round';
                const streakCount = isHR ? 10 : 7;
                for (let i = 0; i < streakCount; i++) {
                    const angle = (Math.PI * 2 / streakCount) * i + 0.3;
                    const r0 = eTime * 4, r1 = eTime * 9;
                    ctx.globalAlpha = alpha * (1 - eTime / 15) * 0.85;
                    ctx.beginPath(); ctx.moveTo(Math.cos(angle) * r0, Math.sin(angle) * r0); ctx.lineTo(Math.cos(angle) * r1, Math.sin(angle) * r1); ctx.stroke();
                }
            }

            // HR bonus: gold star burst + second ring wave
            if (isHR && eTime < 30) {
                ctx.globalAlpha = alpha * 0.7;
                for (let i = 0; i < 6; i++) {
                    const angle2 = (Math.PI * 2 / 6) * i + eTime * 0.15;
                    const d2 = eTime * 6;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath(); ctx.arc(Math.cos(angle2) * d2, Math.sin(angle2) * d2, 5, 0, Math.PI * 2); ctx.fill();
                }
            }

            ctx.restore();
        }

        function renderBall() {

                const ty = lerp(G.ballSY, G.ballAY, tt) + (G.ballEY - G.ballAY) * tf - Math.sin(tt * Math.PI) * (G.ballHump || 0) * 40;

            }

            let rs = 0, ra = 0; a.forEach(g => { rs += g.sc[g.me]; ra += g.sc[1 - g.me]; });
            let streak = 0, sk = ''; if (a.length) { sk = a[0].res; for (const g of a) { if (g.res === sk) streak++; else break; } }
            txt(a.length ? `${a.length}場　${w}勝 ${l}敗 ${d}和　勝率 ${(w + l ? w / (w + l) : 0).toFixed(3).replace(/^0/, '')}　得${rs}失${ra}　${sk === 'W' ? streak + '連勝' : sk === 'L' ? streak + '連敗' : ''}` : '還沒有比賽紀錄，打完一場就會記在這裡', W / 2, 78, 16, '#bcd');
            const rows = a.slice((G.histPage || 0) * 10, (G.histPage || 0) * 10 + 10);
            rows.forEach((g, i) => {
                const y = 100 + i * 42, col = g.res === 'W' ? '#44ff88' : g.res === 'L' ? '#ff6666' : '#aaa';
                ctx.fillStyle = 'rgba(20,35,55,0.75)'; drawRoundRect(ctx, 30, y, W - 60, 38, 7); ctx.fill();
                const dt = new Date(g.t); ctx.font = '11px Arial'; ctx.textAlign = 'left'; ctx.fillStyle = '#789'; ctx.fillText(`${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`, 40, y + 15);
                ctx.fillStyle = '#789'; ctx.fillText(`${['簡單', '普通', '困難'][g.diff] || ''}${g.mp ? ' 連線' : ''}`, 40, y + 30);
                txt(g.res === 'W' ? '勝' : g.res === 'L' ? '敗' : '和', 118, y + 26, 22, col);
                txt(`${g.away} ${g.sc[0]} - ${g.sc[1]} ${g.home}`, 215, y + 26, 18, '#fff', 'center', '', false);
                ctx.font = '12px "PingFang TC","Microsoft JhengHei",Arial'; ctx.textAlign = 'left'; ctx.fillStyle = '#cde';
                ctx.fillText(`勝 ${g.win || '—'}　敗 ${g.lose || '—'}${g.sv ? '　救 ' + g.sv : ''}`, 320, y + 15, W - 360);
                ctx.fillStyle = '#ffd24a'; ctx.fillText(`${g.mvp ? 'MVP ' + g.mvp : ''}${g.hr ? '　全壘打 ' + g.hr : ''}`, 320, y + 31, W - 360);
            });
            const btn = (x, lab, on) => { const hov = mouseX >= x && mouseX <= x + (on === 2 ? 120 : 80) && mouseY >= H - 50 && mouseY <= H - 14; ctx.fillStyle = hov ? 'rgba(70,100,150,0.9)' : 'rgba(25,45,75,0.9)'; drawRoundRect(ctx, x, H - 50, on === 2 ? 120 : 80, 36, 8); ctx.fill(); txt(lab, x + (on === 2 ? 60 : 40), H - 26, 15, '#fff', 'center', '', false); };
            btn(30, '返回', 2); btn(W / 2 - 130, '◀ 較舊', 1); btn(W / 2 + 50, '較新 ▶', 1); if (a.length) btn(W - 150, G.histClear ? '再按確認清除' : '清除紀錄', 2);
            txt(`${(G.histPage || 0) + 1} / ${pages}`, W / 2, H - 26, 14, '#9ab', 'center', '', false);
        }

        // ==========================================
        // MULTIPLAYER (PeerJS WebRTC + QR join, no server needed)
        // ==========================================

        const MP = {
            active: false, isHost: false, peer: null, conn: null,
            remoteX: 0, remoteY: 0, remoteDown: false, remoteUp: false,
            roomId: null, pendingRoomId: null,
            mySide: null, hostSide: 1, hostPick: -1, guestPick: -1, lobbyOpen: false
        };
        const mpSideName = side => side === 1 ? '主場（後攻）' : '客場（先攻）';
        const mpTeamName = i => i >= 0 ? TEAMS[i].abbr : '尚未選擇';

        function mpSend(msg) { if (MP.conn && MP.conn.open) MP.conn.send(msg); }
        function mpMySide() { return MP.isHost ? G.playerSide : MP.mySide; }

        function mpRemoteTurn() {
            if (!MP.active || G.scr !== SCR.GAME) return false;
            if (G.phase === PH.SUB_MENU) return G.subType === 'P' ? playerBatting() : !playerBatting();
            if (G.phase === PH.PITCH_SELECT || G.phase === PH.AIM || G.phase === PH.POWER_GAUGE) return playerBatting();
            if (G.phase === PH.BATTING) return !playerBatting();
            return false;
        }

        function mpSyncInput() {
            if (!MP.active || !MP.isHost) return;
            if (mpRemoteTurn()) {
                mouseX = MP.remoteX; mouseY = MP.remoteY;
                isMouseJustPressed = MP.remoteDown; isMouseJustReleased = MP.remoteUp;
                MP.remoteDown = false; MP.remoteUp = false;
            }
            else if (G.scr === SCR.GAME) { mouseX = realMX; mouseY = realMY; MP.remoteDown = false; MP.remoteUp = false; }   // taps made when it is not their turn must not fire later
        }

        function mpBroadcastState() { mpSend({ t: 'state', g: G }); }

        // ---------- lobby (team selection) ----------
        function mpBuildGrid(el, myPick, oppPick, onPick) {
            el.innerHTML = '';
            TEAMS.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'mp-team' + (i === myPick ? ' sel' : '') + (i === oppPick ? ' taken' : '');
                b.textContent = t.abbr; b.style.borderLeftColor = t.c1 || '#888';
                b.addEventListener('click', () => { if (i !== oppPick) onPick(i); });
                el.appendChild(b);
            });
        }
        function mpLobbyMsg() { return { t: 'lobby', hostSide: MP.hostSide, hostPick: MP.hostPick, guestPick: MP.guestPick }; }
        function mpRefreshLobby() {
            if (MP.isHost) {
                document.getElementById('mp-side-home').classList.toggle('sel', MP.hostSide === 1);
                document.getElementById('mp-side-away').classList.toggle('sel', MP.hostSide === 0);
                mpBuildGrid(document.getElementById('mp-team-grid-host'), MP.hostPick, MP.guestPick, i => { MP.hostPick = i; mpRefreshLobby(); mpSend(mpLobbyMsg()); });
                document.getElementById('mp-opp-pick').textContent = '對手（' + mpSideName(1 - MP.hostSide) + '）：' + mpTeamName(MP.guestPick);
                document.getElementById('mp-start').disabled = !(MP.hostPick >= 0 && MP.guestPick >= 0 && MP.conn && MP.conn.open);
            } else {
                document.getElementById('mp-guest-side').textContent = '你是 ' + mpSideName(1 - MP.hostSide) + '　房主：' + mpTeamName(MP.hostPick);
                mpBuildGrid(document.getElementById('mp-team-grid-guest'), MP.guestPick, MP.hostPick, i => { MP.guestPick = i; mpSend({ t: 'pick', idx: i }); mpRefreshLobby(); });
                document.getElementById('mp-guest-opp').textContent = MP.guestPick >= 0 ? (MP.hostPick >= 0 ? '已選好，等待房主按「開始比賽」…' : '已選好，等待房主選擇隊伍…') : '請選擇你的隊伍';
            }
        }

        function mpHandleData(data) {
            if (!data || !data.t) return;
            if (data.t === 'ptr') { MP.remoteX = data.x; MP.remoteY = data.y; }
            else if (data.t === 'down') { MP.remoteDown = true; }
            else if (data.t === 'up') { MP.remoteUp = true; }
            else if (data.t === 'pick' && MP.isHost) {               // guest chose a team
                if (data.idx !== MP.hostPick && data.idx >= 0 && data.idx < TEAMS.length) MP.guestPick = data.idx;
                mpRefreshLobby(); mpSend(mpLobbyMsg());
            } else if (data.t === 'lobby' && !MP.isHost) {            // host's lobby state
                MP.hostSide = data.hostSide; MP.hostPick = data.hostPick;
                if (data.guestPick !== MP.guestPick && data.guestPick >= 0) MP.guestPick = data.guestPick;
                if (MP.hostPick === MP.guestPick) MP.guestPick = -1;   // host just took the team the guest wanted
                document.getElementById('mp-guest-status').textContent = '已連線：請選擇隊伍';
                document.getElementById('mp-guest-lobby').classList.remove('mp-hidden');
                mpRefreshLobby();
            } else if (data.t === 'assign') {
                MP.mySide = 1 - data.hostSide;
            } else if (data.t === 'start') {
                MP.active = true; mpCloseOverlay();
            } else if (data.t === 'state') {
                if (!MP.isHost) {
                    G = data.g;
                    // never depend on the one-shot 'start' message: once match screens arrive, switch to versus mode
                    if (!MP.active && G.scr !== SCR.TITLE && G.scr !== SCR.SELECT) { MP.active = true; MP.mySide = 1 - G.playerSide; mpCloseOverlay(); }
                    if (MP.active && G.scr === SCR.TITLE) { mpShowEnded(); }
                }
            }
        }

        function mpShowEnded() {
            MP.active = false; MP.lobbyOpen = false;
            document.getElementById('mp-view-menu').classList.add('mp-hidden');
            document.getElementById('mp-view-host').classList.add('mp-hidden');
            document.getElementById('mp-view-guest').classList.remove('mp-hidden');
            document.getElementById('mp-guest-lobby').classList.add('mp-hidden');
            document.getElementById('mp-guest-status').textContent = '對戰已結束（房主已回到主畫面），重新整理頁面即可再玩';
            document.getElementById('mp-overlay').classList.add('show');
        }

        function mpWireConn(conn) {
            MP.conn = conn;
            conn.on('data', mpHandleData);
            conn.on('close', () => { mpSetStatus('對手已離線'); if (MP.isHost) mpRefreshLobby(); });
            conn.on('error', err => console.error('MP conn error', err));
        }

        function mpSetStatus(text) {
            const hostStatus = document.getElementById('mp-status');
            const guestStatus = document.getElementById('mp-guest-status');
            if (MP.isHost && hostStatus) hostStatus.textContent = text;
            if (!MP.isHost && guestStatus) guestStatus.textContent = text;
        }

        function mpOpenMenu() {
            document.getElementById('mp-view-menu').classList.remove('mp-hidden');
            document.getElementById('mp-view-host').classList.add('mp-hidden');
            document.getElementById('mp-view-guest').classList.add('mp-hidden');
            document.getElementById('mp-overlay').classList.add('show');
        }
        function mpCloseOverlay() { document.getElementById('mp-overlay').classList.remove('show'); }

        function mpStartHost() {
            MP.isHost = true;
            document.getElementById('mp-view-menu').classList.add('mp-hidden');
            document.getElementById('mp-view-host').classList.remove('mp-hidden');
            document.getElementById('mp-lobby').classList.add('mp-hidden');
            document.getElementById('mp-status').textContent = '建立房間中...';
            MP.peer = new Peer();
            MP.peer.on('open', id => {
                MP.roomId = id;
                const joinUrl = location.origin + location.pathname + '?room=' + id;
                document.getElementById('mp-room-code').textContent = id;
                const qrDiv = document.getElementById('mp-qr'); qrDiv.innerHTML = '';
                try {
                    const qr = qrcode(0, 'M'); qr.addData(joinUrl); qr.make();
                    qrDiv.innerHTML = qr.createImgTag(5, 4);
                } catch (e) { qrDiv.textContent = joinUrl; }
                document.getElementById('mp-status').textContent = '請對方掃描 QR code 加入';
            });
            MP.peer.on('connection', conn => {
                mpWireConn(conn);
                conn.on('open', () => {
                    document.getElementById('mp-host-title').textContent = '對手已連線';
                    document.getElementById('mp-status').textContent = '請選擇主客場與你的隊伍，雙方選好後按「開始比賽」';
                    document.getElementById('mp-qr').classList.add('mp-hidden'); document.getElementById('mp-room-code').classList.add('mp-hidden');
                    document.getElementById('mp-lobby').classList.remove('mp-hidden');
                    MP.guestPick = -1; mpRefreshLobby(); mpSend(mpLobbyMsg());
                });
            });
            MP.peer.on('error', err => { document.getElementById('mp-status').textContent = '連線服務錯誤，請重新整理再試'; console.error(err); });
        }

        function mpHostStart() {
            const hostSide = MP.hostSide, hp = MP.hostPick, gp = MP.guestPick;
            if (hp < 0 || gp < 0 || hp === gp) return;
            initState();
            G.playerSide = hostSide; G.difficulty = 1; G.maxInn = MP.innings || 9;
            G.awayIdx = hostSide === 0 ? hp : gp; G.homeIdx = hostSide === 1 ? hp : gp;
            G.usedBatters = [Array(TEAMS[G.awayIdx].roster.batters.length).fill(false), Array(TEAMS[G.homeIdx].roster.batters.length).fill(false)];
            G.usedPitchers = [Array(TEAMS[G.awayIdx].roster.pitchers.length).fill(false), Array(TEAMS[G.homeIdx].roster.pitchers.length).fill(false)];
            for (let i = 0; i < 9; i++) { G.usedBatters[0][i] = true; G.usedBatters[1][i] = true; }
            G.usedPitchers[0][0] = true; G.usedPitchers[1][0] = true;
            G.lineupPos = null; G.lnSel = null; G.lnPick = null;
            G.scr = SCR.LINEUP; G.introTimer = 0; G.ballActive = false;
            MP.active = true; MP.mySide = hostSide;
            mpSend({ t: 'assign', hostSide: hostSide });
            mpSend({ t: 'start' });
            [300, 1000, 2500].forEach(ms => setTimeout(() => { mpSend({ t: 'assign', hostSide: hostSide }); mpSend({ t: 'start' }); }, ms));
            mpCloseOverlay();
        }

        document.querySelectorAll('.mp-inn').forEach(b => b.addEventListener('click', () => { MP.innings = +b.dataset.n; document.querySelectorAll('.mp-inn').forEach(x => x.classList.toggle('sel', x === b)); }));
        document.getElementById('mp-create-btn').addEventListener('click', mpStartHost);
        document.getElementById('mp-close-btn').addEventListener('click', mpCloseOverlay);
        document.getElementById('mp-host-cancel').addEventListener('click', () => {
            if (MP.peer) MP.peer.destroy();
            MP.isHost = false; MP.active = false; MP.peer = null; MP.conn = null; MP.hostPick = MP.guestPick = -1; mpCloseOverlay();
            document.getElementById('mp-qr').classList.remove('mp-hidden'); document.getElementById('mp-room-code').classList.remove('mp-hidden');
        });
        document.getElementById('mp-side-home').addEventListener('click', () => { MP.hostSide = 1; mpRefreshLobby(); mpSend(mpLobbyMsg()); });
        document.getElementById('mp-side-away').addEventListener('click', () => { MP.hostSide = 0; mpRefreshLobby(); mpSend(mpLobbyMsg()); });
        document.getElementById('mp-start').addEventListener('click', mpHostStart);

        (function mpCheckAutoJoin() {
            const room = new URLSearchParams(location.search).get('room');
            if (!room) return;
            MP.isHost = false; MP.pendingRoomId = room;
            document.getElementById('mp-view-menu').classList.add('mp-hidden');
            document.getElementById('mp-view-host').classList.add('mp-hidden');
            document.getElementById('mp-view-guest').classList.remove('mp-hidden');
            document.getElementById('mp-overlay').classList.add('show');
            document.getElementById('mp-guest-status').textContent = '連線中...';
            MP.peer = new Peer();
            MP.peer.on('open', () => {
                const conn = MP.peer.connect(room, { reliable: true });
                mpWireConn(conn);
                conn.on('open', () => { document.getElementById('mp-guest-status').textContent = '已連線，等待房主...'; });
            });
            MP.peer.on('error', err => { document.getElementById('mp-guest-status').textContent = '連線失敗，請確認連結正確，或請房主重新建立房間'; console.error(err); });
        })();

        // Relay guest's own pointer/touch input to the host over the data channel
        function mpCanvasXY(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
        }
        let mpLastPtrSend = 0;
        canvas.addEventListener('mousemove', e => {
            if (!MP.active || MP.isHost) return;
            const now = performance.now(); if (now - mpLastPtrSend < 25) return; mpLastPtrSend = now;
            const p = mpCanvasXY(e.clientX, e.clientY); mpSend({ t: 'ptr', x: p.x, y: p.y });
        });
        canvas.addEventListener('touchmove', e => {
            if (!MP.active || MP.isHost || e.touches.length === 0) return;
            const now = performance.now(); if (now - mpLastPtrSend < 25) return; mpLastPtrSend = now;
            const p = mpCanvasXY(e.touches[0].clientX, e.touches[0].clientY); mpSend({ t: 'ptr', x: p.x, y: p.y });
        });
        canvas.addEventListener('mousedown', e => {
            if (!MP.active || MP.isHost) return;
            const p = mpCanvasXY(e.clientX, e.clientY); mpSend({ t: 'ptr', x: p.x, y: p.y }); mpSend({ t: 'down' });
        });
        canvas.addEventListener('touchstart', e => {
            if (!MP.active || MP.isHost || e.touches.length === 0) return;
            const p = mpCanvasXY(e.touches[0].clientX, e.touches[0].clientY); mpSend({ t: 'ptr', x: p.x, y: p.y });
            if (!(isMobile && G.phase === PH.BATTING)) mpSend({ t: 'down' });
        });
        canvas.addEventListener('mouseup', () => { if (MP.active && !MP.isHost) mpSend({ t: 'up' }); });
        canvas.addEventListener('touchend', () => { if (MP.active && !MP.isHost) mpSend({ t: 'up' }); });

        // ==========================================
        // GAME LOOP & EVENTS
        // ==========================================

        function loop() {
            if (MP.active && !MP.isHost) {
                render();
            } else {
                update(); render();
                if (MP.active && MP.isHost) mpBroadcastState();
            }
            const btnS = document.getElementById('swing-btn'); const btnC = document.getElementById('change-btn'); const btnA = document.getElementById('sim-btn'); const btnSt = document.getElementById('steal-btn'); const btnBu = document.getElementById('bunt-btn'), btnPw = document.getElementById('power-btn');
            if (!(isMobile && G.scr === SCR.GAME && playerBatting() && !(MP.active && !MP.isHost))) { btnBu.classList.remove('show'); btnPw.classList.remove('show'); }
            if (MP.active && !MP.isHost) {
                // guest on a phone: a swing button while it is their turn to bat (aim by dragging, then press swing)
                if (isMobile && G.scr === SCR.GAME && mpRemoteTurn() && G.phase === PH.BATTING) btnS.classList.add('show'); else btnS.classList.remove('show');
                btnC.classList.remove('show'); btnA.classList.remove('show'); btnSt.classList.remove('show');
            } else if (isMobile && G.scr === SCR.GAME) {
                if (playerBatting() && (G.phase === PH.WAIT_PITCH || G.phase === PH.BATTING)) {
                    btnS.classList.add('show'); btnC.classList.add('show'); btnA.classList.remove('show');
                    if (canSteal()) btnSt.classList.add('show'); else btnSt.classList.remove('show');
                    if (canBunt()) { btnBu.classList.add('show'); btnPw.classList.add('show'); } else { btnBu.classList.remove('show'); btnPw.classList.remove('show'); }
                } else if (!playerBatting() && G.phase === PH.PITCH_SELECT) {
                    btnS.classList.remove('show'); btnC.classList.add('show'); btnA.classList.add('show'); btnSt.classList.remove('show');
                } else { btnS.classList.remove('show'); btnC.classList.remove('show'); btnA.classList.remove('show'); btnSt.classList.remove('show'); }
            } else { btnS.classList.remove('show'); btnC.classList.remove('show'); btnA.classList.remove('show'); btnSt.classList.remove('show'); }
            requestAnimationFrame(loop);
        }
        loop();

        // Mobile Events
        document.getElementById('swing-btn').addEventListener('touchstart', e => {
            e.preventDefault();
            if (MP.active && !MP.isHost) { if (G.phase === PH.BATTING) mpSend({ t: 'down' }); return; }
            if (G.scr === SCR.GAME && playerBatting() && G.phase === PH.BATTING && !G.phDone && !G.phPressed) {
                G.phPressed = true; G.phValue = G.phPos; resolveSwing(G.phValue, G.curX, G.curY);
            }
        }, { passive: false });
        document.getElementById('swing-btn').addEventListener('mousedown', e => {
            e.preventDefault();
            if (MP.active && !MP.isHost) { if (G.phase === PH.BATTING) mpSend({ t: 'down' }); return; }
            if (G.scr === SCR.GAME && playerBatting() && G.phase === PH.BATTING && !G.phDone && !G.phPressed) {
                G.phPressed = true; G.phValue = G.phPos; resolveSwing(G.phValue, G.curX, G.curY);
            }
        });
        document.getElementById('sim-btn').addEventListener('touchstart', e => {
            e.preventDefault();
            if (G.scr === SCR.GAME && !playerBatting() && G.phase === PH.PITCH_SELECT) simulateHalf();
        }, { passive: false });
        document.getElementById('sim-btn').addEventListener('mousedown', e => {
            e.preventDefault();
            if (G.scr === SCR.GAME && !playerBatting() && G.phase === PH.PITCH_SELECT) simulateHalf();
        });
        document.getElementById('change-btn').addEventListener('touchstart', e => {
            e.preventDefault();
            if (G.scr !== SCR.GAME) return;
            if (!playerBatting() && G.phase === PH.PITCH_SELECT) { G.subType = 'P'; G.prevPhase = G.phase; G.phase = PH.SUB_MENU; }
            else if (playerBatting() && G.phase === PH.WAIT_PITCH) { G.subType = 'B'; G.prevPhase = G.phase; G.phase = PH.SUB_MENU; }
        }, { passive: false });
        document.getElementById('change-btn').addEventListener('mousedown', e => {
            e.preventDefault();
            if (G.scr !== SCR.GAME) return;
            if (!playerBatting() && G.phase === PH.PITCH_SELECT) { G.subType = 'P'; G.prevPhase = G.phase; G.phase = PH.SUB_MENU; }
            else if (playerBatting() && G.phase === PH.WAIT_PITCH) { G.subType = 'B'; G.prevPhase = G.phase; G.phase = PH.SUB_MENU; }
        });
        document.getElementById('bunt-btn').addEventListener('touchstart', e => { e.preventDefault(); toggleBunt(); }, { passive: false });
        document.getElementById('power-btn').addEventListener('touchstart', e => { e.preventDefault(); togglePower(); }, { passive: false });
        document.getElementById('steal-btn').addEventListener('touchstart', e => {
            e.preventDefault(); attemptSteal();
        }, { passive: false });
        document.getElementById('steal-btn').addEventListener('mousedown', e => {
            e.preventDefault(); attemptSteal();
        });
    </script>
</body>
